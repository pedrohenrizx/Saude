<!DOCTYPE html>
<html lang="pt-br" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTrack - Calculadora de Saúde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(15, 23, 42, 0.8); }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

    <div id="auth-screen" class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md space-y-8 bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-xl">
            <div class="text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-500 rounded-full mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <h2 id="auth-title" class="text-3xl font-bold">Bem-vindo</h2>
                <p id="auth-subtitle" class="text-slate-500 dark:text-slate-400 mt-2">Entre na sua conta para monitorar sua saúde</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-sm font-medium mb-1">Nome Completo</label>
                    <input type="text" id="user-name" class="w-full px-4 py-2 rounded-lg border dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition" placeholder="João Silva">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">E-mail</label>
                    <input type="email" id="user-email" required class="w-full px-4 py-2 rounded-lg border dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Senha</label>
                    <input type="password" id="user-password" required class="w-full px-4 py-2 rounded-lg border dark:border-slate-700 bg-transparent focus:ring-2 focus:ring-primary-500 outline-none transition" placeholder="••••••••">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 rounded-lg transition-all transform active:scale-95">Entrar</button>
            </form>

            <div class="text-center">
                <button id="toggle-auth" class="text-primary-600 hover:underline text-sm font-medium">Não tem uma conta? Cadastre-se</button>
            </div>
        </div>
    </div>

    <div id="app-screen" class="hidden flex-grow flex flex-col">
        <header class="sticky top-0 z-40 w-full glass border-b dark:border-slate-800 p-4">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-primary-500 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <span class="font-bold text-xl tracking-tight">HealthTrack</span>
                </div>
                <div class="flex items-center gap-4">
                    <button id="theme-toggle" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                        <svg id="sun-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
                        <svg id="moon-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    </button>
                    <div id="user-profile" class="hidden md:flex items-center gap-2 border-l pl-4 dark:border-slate-800">
                        <span id="display-username" class="text-sm font-medium">Usuário</span>
                        <button id="logout-btn" class="text-xs text-red-500 hover:underline">Sair</button>
                    </div>
                </div>
            </div>
        </header>

        <main id="main-content" class="max-w-6xl mx-auto w-full p-4 md:p-8 pb-24 md:pb-8 flex-grow">
        </main>

        <nav class="fixed bottom-0 left-0 w-full glass border-t dark:border-slate-800 md:relative md:border-none md:bg-transparent no-print">
            <div class="max-w-6xl mx-auto px-6 py-3 flex justify-between md:justify-center md:gap-12">
                <button onclick="router.navigate('dashboard')" class="nav-link flex flex-col items-center gap-1 group">
                    <svg class="w-6 h-6 group-hover:text-primary-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <span class="text-[10px] font-medium uppercase tracking-widest">Início</span>
                </button>
                <button onclick="router.navigate('calc')" class="nav-link flex flex-col items-center gap-1 group">
                    <svg class="w-6 h-6 group-hover:text-primary-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    <span class="text-[10px] font-medium uppercase tracking-widest">Calcular</span>
                </button>
                <button onclick="router.navigate('history')" class="nav-link flex flex-col items-center gap-1 group">
                    <svg class="w-6 h-6 group-hover:text-primary-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="text-[10px] font-medium uppercase tracking-widest">Histórico</span>
                </button>
                <button onclick="router.navigate('profile')" class="nav-link flex flex-col items-center gap-1 group">
                    <svg class="w-6 h-6 group-hover:text-primary-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span class="text-[10px] font-medium uppercase tracking-widest">Perfil</span>
                </button>
            </div>
        </nav>
    </div>

    <div id="toast-container" class="fixed top-4 right-4 z-50 pointer-events-none"></div>

    <script>
        const store = {
            currentUser: null,
            getUsers: () => JSON.parse(localStorage.getItem('ht_users') || '[]'),
            saveUser: (user) => {
                const users = store.getUsers();
                users.push(user);
                localStorage.setItem('ht_users', JSON.stringify(users));
            },
            getLogs: (userId) => JSON.parse(localStorage.getItem(`ht_logs_${userId}`) || '[]'),
            saveLog: (userId, log) => {
                const logs = store.getLogs(userId);
                logs.unshift({ ...log, id: Date.now(), date: new Date().toISOString() });
                localStorage.setItem(`ht_logs_${userId}`, JSON.stringify(logs));
            }
        };

        const showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
            toast.className = `${color} text-white px-6 py-3 rounded-lg shadow-lg mb-2 transition-all transform translate-x-full duration-300 pointer-events-auto`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full'), 10);
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        const router = {
            navigate: (view) => {
                const content = document.getElementById('main-content');
                document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('text-primary-500'));
                
                switch(view) {
                    case 'dashboard':
                        renderDashboard(content);
                        break;
                    case 'calc':
                        renderCalc(content);
                        break;
                    case 'history':
                        renderHistory(content);
                        break;
                    case 'profile':
                        renderProfile(content);
                        break;
                }
                window.scrollTo(0,0);
            }
        };

        function renderDashboard(container) {
            const logs = store.getLogs(store.currentUser.email);
            const stats = {
                total: logs.length,
                gluco: logs.filter(l => l.type === 'Glicose').length,
                hemo: logs.filter(l => l.type === 'Hemoglobina').length
            };

            container.innerHTML = `
                <div class="space-y-6 animate-fadeIn">
                    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border dark:border-slate-800">
                            <p class="text-slate-500 text-sm font-medium">Total de Cálculos</p>
                            <h3 class="text-3xl font-bold mt-1">${stats.total}</h3>
                        </div>
                        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border dark:border-slate-800">
                            <p class="text-slate-500 text-sm font-medium">Glicose Medida</p>
                            <h3 class="text-3xl font-bold mt-1 text-emerald-500">${stats.gluco}</h3>
                        </div>
                        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border dark:border-slate-800">
                            <p class="text-slate-500 text-sm font-medium">Hemoglobina Medida</p>
                            <h3 class="text-3xl font-bold mt-1 text-blue-500">${stats.hemo}</h3>
                        </div>
                    </section>

                    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border dark:border-slate-800 shadow-sm">
                            <h4 class="font-bold mb-4">Evolução de Glicose</h4>
                            <canvas id="chart-gluco" height="200"></canvas>
                        </div>
                        <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border dark:border-slate-800 shadow-sm">
                            <h4 class="font-bold mb-4">Composição de Dieta (Média)</h4>
                            <canvas id="chart-pie" height="200"></canvas>
                        </div>
                    </section>
                </div>
            `;

            initCharts(logs);
        }

        function initCharts(logs) {
            const glucoLogs = logs.filter(l => l.type === 'Glicose').slice(0, 7).reverse();
            if (glucoLogs.length > 0) {
                new Chart(document.getElementById('chart-gluco'), {
                    type: 'line',
                    data: {
                        labels: glucoLogs.map(l => new Date(l.date).toLocaleDateString()),
                        datasets: [{
                            label: 'mg/dL',
                            data: glucoLogs.map(l => l.value),
                            borderColor: '#10b981',
                            tension: 0.4,
                            fill: true,
                            backgroundColor: 'rgba(16, 185, 129, 0.1)'
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            }

            const macroLogs = logs.filter(l => l.type === 'Nutrientes');
            if (macroLogs.length > 0) {
                const latest = macroLogs[0];
                new Chart(document.getElementById('chart-pie'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Carboidratos', 'Proteínas'],
                        datasets: [{
                            data: [latest.carbs, latest.proteins],
                            backgroundColor: ['#f59e0b', '#3b82f6']
                        }]
                    },
                    options: { responsive: true }
                });
            }
        }

        function renderCalc(container) {
            container.innerHTML = `
                <div class="max-w-2xl mx-auto space-y-6">
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl shadow-sm border dark:border-slate-800">
                        <h2 class="text-xl font-bold mb-4">Novo Cálculo</h2>
                        <div class="grid grid-cols-2 gap-2 mb-6">
                            <button onclick="switchCalcType('glicose')" id="btn-glicose" class="calc-tab-btn p-3 rounded-lg border dark:border-slate-700 bg-primary-500 text-white">Glicose</button>
                            <button onclick="switchCalcType('hemoglobina')" id="btn-hemoglobina" class="calc-tab-btn p-3 rounded-lg border dark:border-slate-700">Hemoglobina</button>
                            <button onclick="switchCalcType('nutrientes')" id="btn-nutrientes" class="calc-tab-btn p-3 rounded-lg border dark:border-slate-700">Nutrientes</button>
                            <button onclick="switchCalcType('imc')" id="btn-imc" class="calc-tab-btn p-3 rounded-lg border dark:border-slate-700">IMC</button>
                        </div>

                        <form id="calc-form" class="space-y-4">
                            <div id="calc-inputs"></div>
                            <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white py-3 rounded-xl font-bold transition">Calcular e Salvar</button>
                        </form>
                    </div>
                    <div id="calc-result" class="hidden animate-slideUp"></div>
                </div>
            `;
            switchCalcType('glicose');
        }

        let currentType = 'glicose';
        function switchCalcType(type) {
            currentType = type;
            document.querySelectorAll('.calc-tab-btn').forEach(b => {
                b.classList.remove('bg-primary-500', 'text-white');
                b.classList.add('bg-transparent');
            });
            document.getElementById(`btn-${type}`).classList.add('bg-primary-500', 'text-white');
            
            const inputs = document.getElementById('calc-inputs');
            if(type === 'glicose') {
                inputs.innerHTML = `<label class="block text-sm mb-1">Glicemia (mg/dL)</label><input type="number" id="v1" step="0.1" required class="w-full p-3 rounded-lg border dark:bg-slate-800 dark:border-slate-700" placeholder="Ex: 95">`;
            } else if (type === 'hemoglobina') {
                inputs.innerHTML = `<label class="block text-sm mb-1">Hemoglobina (g/dL)</label><input type="number" id="v1" step="0.1" required class="w-full p-3 rounded-lg border dark:bg-slate-800 dark:border-slate-700" placeholder="Ex: 14.2">`;
            } else if (type === 'nutrientes') {
                inputs.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm mb-1">Proteínas (g)</label><input type="number" id="v1" required class="w-full p-3 rounded-lg border dark:bg-slate-800 dark:border-slate-700" placeholder="0"></div>
                        <div><label class="block text-sm mb-1">Carbos (g)</label><input type="number" id="v2" required class="w-full p-3 rounded-lg border dark:bg-slate-800 dark:border-slate-700" placeholder="0"></div>
                    </div>
                `;
            } else if (type === 'imc') {
                inputs.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm mb-1">Peso (kg)</label><input type="number" id="v1" step="0.1" required class="w-full p-3 rounded-lg border dark:bg-slate-800 dark:border-slate-700" placeholder="70"></div>
                        <div><label class="block text-sm mb-1">Altura (m)</label><input type="number" id="v2" step="0.01" required class="w-full p-3 rounded-lg border dark:bg-slate-800 dark:border-slate-700" placeholder="1.75"></div>
                    </div>
                `;
            }
        }

        function renderHistory(container) {
            const logs = store.getLogs(store.currentUser.email);
            container.innerHTML = `
                <div class="max-w-4xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">Seu Histórico</h2>
                        <button onclick="window.print()" class="bg-slate-200 dark:bg-slate-800 px-4 py-2 rounded-lg text-sm flex items-center gap-2 no-print">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                            Exportar PDF
                        </button>
                    </div>
                    <div class="space-y-4">
                        ${logs.length === 0 ? '<p class="text-center text-slate-500 py-10">Nenhum cálculo encontrado.</p>' : 
                        logs.map(log => `
                            <div class="bg-white dark:bg-slate-900 p-5 rounded-xl border dark:border-slate-800 shadow-sm flex justify-between items-center">
                                <div>
                                    <span class="text-xs font-bold uppercase tracking-widest text-primary-500">${log.type}</span>
                                    <h4 class="text-lg font-bold">${log.resultText}</h4>
                                    <p class="text-sm text-slate-400">${new Date(log.date).toLocaleString()}</p>
                                </div>
                                <div class="text-right">
                                    <span class="text-xl font-black">${log.value || log.bmi || '-'}</span>
                                    <p class="text-[10px] text-slate-500">${log.unit || ''}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProfile(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto text-center space-y-6">
                    <div class="w-24 h-24 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto flex items-center justify-center">
                        <svg class="w-12 h-12 text-slate-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold">${store.currentUser.name}</h2>
                        <p class="text-slate-500">${store.currentUser.email}</p>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border dark:border-slate-800 text-left">
                        <h4 class="font-bold mb-4">Configurações</h4>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <span>Privacidade de Dados</span>
                                <div class="w-10 h-5 bg-emerald-500 rounded-full relative"><div class="absolute right-1 top-1 w-3 h-3 bg-white rounded-full"></div></div>
                            </div>
                            <div class="flex justify-between items-center">
                                <span>Unidades Métricas</span>
                                <span class="text-xs font-bold bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">BR / SI</span>
                            </div>
                        </div>
                    </div>
                    <button id="logout-final" class="w-full border border-red-500 text-red-500 py-3 rounded-xl hover:bg-red-50 transition">Sair da Conta</button>
                </div>
            `;
            document.getElementById('logout-final').addEventListener('click', logout);
        }

        // Logic
        const authForm = document.getElementById('auth-form');
        const toggleAuth = document.getElementById('toggle-auth');
        let isLogin = true;

        toggleAuth.onclick = () => {
            isLogin = !isLogin;
            document.getElementById('name-field').classList.toggle('hidden');
            document.getElementById('auth-title').textContent = isLogin ? 'Bem-vindo' : 'Criar Conta';
            document.getElementById('auth-subtitle').textContent = isLogin ? 'Entre na sua conta' : 'Comece sua jornada saudável agora';
            document.getElementById('auth-btn').textContent = isLogin ? 'Entrar' : 'Cadastrar';
            toggleAuth.textContent = isLogin ? 'Não tem uma conta? Cadastre-se' : 'Já tem uma conta? Entre';
        };

        authForm.onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('user-email').value;
            const pass = document.getElementById('user-password').value;
            const name = document.getElementById('user-name').value;

            const users = store.getUsers();
            if (isLogin) {
                const user = users.find(u => u.email === email && u.pass === pass);
                if (user) login(user);
                else showToast('E-mail ou senha inválidos', 'error');
            } else {
                if (users.find(u => u.email === email)) {
                    showToast('E-mail já cadastrado', 'error');
                } else {
                    const newUser = { name, email, pass };
                    store.saveUser(newUser);
                    login(newUser);
                }
            }
        };

        function login(user) {
            store.currentUser = user;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('display-username').textContent = user.name;
            router.navigate('dashboard');
            showToast(`Bem-vindo, ${user.name.split(' ')[0]}!`);
        }

        function logout() {
            store.currentUser = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            authForm.reset();
        }

        document.getElementById('logout-btn').onclick = logout;

        // Theme Toggle
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.onclick = () => {
            document.documentElement.classList.toggle('dark');
            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');
        };

        // Calc Engine
        document.addEventListener('submit', (e) => {
            if(e.target.id === 'calc-form') {
                e.preventDefault();
                const v1 = parseFloat(document.getElementById('v1').value);
                const v2 = document.getElementById('v2') ? parseFloat(document.getElementById('v2').value) : null;
                
                let log = { type: '', value: v1, resultText: '', unit: '', color: '' };
                
                if(currentType === 'glicose') {
                    log.type = 'Glicose';
                    log.unit = 'mg/dL';
                    if(v1 < 70) log.resultText = 'Hipoglicemia';
                    else if(v1 <= 99) log.resultText = 'Normal';
                    else if(v1 <= 125) log.resultText = 'Pré-diabetes';
                    else log.resultText = 'Diabetes';
                } else if(currentType === 'hemoglobina') {
                    log.type = 'Hemoglobina';
                    log.unit = 'g/dL';
                    if(v1 < 12) log.resultText = 'Possível Anemia';
                    else if(v1 <= 16) log.resultText = 'Nível Saudável';
                    else log.resultText = 'Nível Elevado';
                } else if(currentType === 'nutrientes') {
                    log.type = 'Nutrientes';
                    log.proteins = v1;
                    log.carbs = v2;
                    log.resultText = 'Dieta Balanceada';
                    log.value = v1 + v2;
                    log.unit = 'g totais';
                } else if(currentType === 'imc') {
                    log.type = 'IMC';
                    const bmi = (v1 / (v2 * v2)).toFixed(1);
                    log.bmi = bmi;
                    log.value = bmi;
                    if(bmi < 18.5) log.resultText = 'Abaixo do Peso';
                    else if(bmi < 25) log.resultText = 'Peso Ideal';
                    else log.resultText = 'Sobrepeso';
                }

                store.saveLog(store.currentUser.email, log);
                showToast('Cálculo salvo com sucesso!');
                
                const resDiv = document.getElementById('calc-result');
                resDiv.innerHTML = `
                    <div class="bg-primary-50 dark:bg-primary-900/20 p-6 rounded-2xl border-2 border-primary-500">
                        <p class="text-xs uppercase font-bold text-primary-600">Resultado do Cálculo</p>
                        <h3 class="text-2xl font-bold text-primary-700 dark:text-primary-400">${log.resultText}</h3>
                        <p class="text-slate-600 dark:text-slate-400 mt-2">Seu valor: ${log.value} ${log.unit}</p>
                        <div class="mt-4 p-4 bg-white dark:bg-slate-800 rounded-lg text-sm italic">
                            💡 Recomendação: Mantenha uma rotina equilibrada e consulte sempre um profissional de saúde.
                        </div>
                    </div>
                `;
                resDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
